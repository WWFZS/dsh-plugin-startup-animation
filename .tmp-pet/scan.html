<!doctype html><html><body style="margin:0;background:#fff">
<video id="v" src="" muted playsinline style="width:480px;display:block"></video>
<canvas id="c" width="480" height="648" style="display:none"></canvas>
<script>
window.scan = (name) => new Promise((resolve) => {
  const v = document.getElementById('v')
  const c = document.getElementById('c')
  const ctx = c.getContext('2d')
  v.src = '/builtin/%E5%AE%A0%E7%89%A9/%E5%99%9C%E5%99%9C/' + encodeURIComponent(name) + '.webm'
  v.onloadedmetadata = () => { v.currentTime = 4.2 }
  v.onseeked = () => {
    ctx.clearRect(0, 0, 480, 648)
    ctx.drawImage(v, 0, 0, 480, 648)
    const d = ctx.getImageData(0, 0, 480, 648).data
    const rows = {}
    let total = 0
    const samples = []
    for (let y = 0; y < 648; y++) {
      for (let x = 0; x < 480; x++) {
        const i = (y * 480 + x) * 4
        const a = d[i+3], r = d[i], g = d[i+1], b = d[i+2]
        if (a > 200 && Math.max(r,g,b) < 130) {
          rows[y] = (rows[y] ?? 0) + 1
          total++
          if (samples.length < 6 && y > 480) samples.push(`(${x},${y}) rgb(${r},${g},${b}) a=${a}`)
        }
      }
    }
    const hot = Object.entries(rows).map(([y, n]) => [+y, n]).filter(([, n]) => n > 20).sort((a, b) => b[1] - a[1]).slice(0, 8)
    resolve({ total, 热点行: hot.map(([y, n]) => `y=${y}:${n}px`), 底部样本: samples })
  }
})
</script></body></html>
